<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo madera oscura -->
  <rect width="64" height="64" rx="12" fill="#5C2E0E"/>
  <!-- Veta de madera -->
  <path d="M0 18 Q32 15 64 18" stroke="#6E3A18" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M0 30 Q32 27 64 30" stroke="#6E3A18" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M0 46 Q32 43 64 46" stroke="#6E3A18" stroke-width="2"   fill="none" opacity="0.6"/>
  <path d="M0 57 Q32 54 64 57" stroke="#6E3A18" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Cuchara — cuenco -->
  <ellipse cx="32" cy="17" rx="10" ry="12" fill="#E8C17A"/>
  <!-- Sombra interior del cuenco -->
  <ellipse cx="32" cy="18" rx="6.5" ry="8" fill="#C8973A" opacity="0.45"/>
  <!-- Cuchara — mango -->
  <path d="M29.5 27.5
           C28.5 36 27 46 28.5 55
           Q32 58.5 35.5 55
           C37 46 35.5 36 34.5 27.5 Z"
        fill="#E8C17A"/>
  <!-- Detalle tallado en el mango -->
  <line x1="32" y1="34" x2="32" y2="52" stroke="#C8973A" stroke-width="1" opacity="0.5"/>
</svg>
